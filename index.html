<title>BTS SIO · LSA Toolbox</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/sio-favicon-32.png?v=1">
<style id="lsa-h1-or">h1,h1 em,h1 span{color:#f5b60f!important}</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
:root{--navy:#1a2744;--navy-deep:#0f1a33;--blue:#2d5fa6;--accent:#f5b60f;--accent-deep:#c98f00;--green:#2a7a4b;--red:#b5302b;--bg:#f5f3ef;--surface:#fff;--border:#ddd5c5;--text:#2a2520;--muted:#6f6555;--shadow:0 2px 14px rgba(26,39,68,.10);--shadow-lg:0 14px 40px rgba(26,39,68,.18);--tab:64px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--navy)}
button{font-family:inherit;cursor:pointer}
svg{flex-shrink:0}
/* ── shell ── */
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:var(--navy-deep);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--accent)}
.top img{width:32px;height:32px;border-radius:6px;background:#fff;padding:2px}
.top .tt{flex:1;min-width:0;line-height:1.2}
.top .tt b{display:block;font-size:16px}
.top .tt small{font-size:12px;color:rgba(255,255,255,.75)}
.top .ib{width:44px;height:44px;border-radius:10px;border:none;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center}
.top .ib:active{background:rgba(255,255,255,.12)}
main{padding:18px 16px calc(var(--tab) + 28px + env(safe-area-inset-bottom));max-width:1180px;width:100%;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy-deep);border-top:3px solid var(--accent);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
.tabs a{height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.7);font-size:11px;font-weight:600}
.tabs a.on{color:var(--accent)}.tabs .tbot{width:22px;height:22px;border-radius:5px;background:#fff;padding:1px;object-fit:contain}.tabs a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
/* ── common ── */
h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1;font-weight:700}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy)}
.sec span{font-size:13px;color:var(--muted)}
.hello{background:linear-gradient(135deg,var(--navy) 0%,#243260 60%,var(--blue) 135%);border-radius:14px;padding:22px 20px;color:#fff;border-bottom:3px solid var(--accent)}
.hello p{color:rgba(255,255,255,.85);margin-top:8px;font-size:15px}
.resume{display:flex;align-items:center;gap:12px;margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 12px;color:#fff;min-height:52px}
.resume:hover{color:#fff;background:rgba(255,255,255,.16)}
.resume small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.resume b{font-weight:600;font-size:15px}
.resume .g{flex:1;min-width:0}
/* chapter list */
.chs{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.ch{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px 8px 8px;color:var(--text);box-shadow:var(--shadow);transition:.2s}
.ch:hover{color:var(--text);border-color:var(--blue);box-shadow:var(--shadow-lg)}
.ch .im{width:72px;height:72px;border-radius:8px;background:var(--navy) center/cover no-repeat;position:relative}
.ch .im i{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--navy-deep);font-style:normal;font-weight:700;font-size:13px;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.ch b{display:block;color:var(--navy);font-size:15.5px;line-height:1.25}
.ch p{font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch .ar{color:var(--blue)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--navy);display:flex;flex-direction:column;gap:10px;min-height:96px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--blue);color:var(--navy)}
.tile .ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--navy);color:var(--accent)}
.tile b{font-size:15px;line-height:1.25}.tile .ic.bot{background:#fff;border:1px solid var(--border)}.tile .ic.bot img{width:26px;height:26px;object-fit:contain}
.tile small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
/* chapter view */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-height:44px;margin:-8px 0 4px}
.cover{border-radius:14px;overflow:hidden;position:relative;min-height:210px;display:flex;align-items:flex-end;background:var(--navy) center/cover no-repeat;border-bottom:3px solid var(--accent)}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,26,51,.15) 0%,rgba(15,26,51,.92) 100%)}
.cover .in{position:relative;padding:20px;color:#fff}
.cover .k{display:inline-block;background:var(--green);color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:5px;padding:2px 9px;margin-bottom:10px}
.cover p{color:rgba(255,255,255,.88);margin-top:8px;font-size:15px;max-width:620px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 24px}
.res{display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 12px;color:var(--text);min-height:60px}
.r:hover{border-color:var(--blue);color:var(--text)}
.r .ic{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--blue)}
.r .ic.read{background:var(--navy)}.r .ic.sum{background:var(--blue)}.r .ic.ess{background:var(--green)}.r .ic.voc{background:var(--accent);color:var(--navy-deep)}.r .ic.vid{background:var(--red)}
.r small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-deep)}
.r b{display:block;font-size:15px;font-weight:600;color:var(--navy);line-height:1.3}
.r .ar{color:var(--muted)}
.ext{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
/* segmented */
.seg{display:flex;gap:6px;background:#ebe6dc;border-radius:11px;padding:4px;margin:16px 0 4px;overflow-x:auto}
.seg button{flex:1;min-height:40px;border:none;border-radius:8px;background:transparent;font-weight:600;font-size:14px;color:var(--navy);white-space:nowrap;padding:0 12px}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.grp{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px}
/* search */
.sbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 14px;min-height:50px;margin-top:4px}
.sbox:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,95,166,.15)}
.sbox input{flex:1;border:none;outline:none;font:inherit;font-size:16px;background:transparent;color:var(--text);min-width:0}
.lead{color:var(--muted);margin-top:8px;max-width:640px}.r .dsc{display:block;font-style:normal;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}.sec a{font-size:13px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:40px;color:var(--muted);font-size:13px;text-align:center}
.foot img.l{width:34px;height:34px}
.visit-count{margin-top:8px}.visit-count img{height:16px;vertical-align:middle}
/* ── desktop ── */
@media(min-width:960px){
.app{grid-template-columns:260px minmax(0,1fr)}
.top,.tabs{display:none}
.side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--navy-deep);color:#fff;border-right:3px solid var(--accent);padding:22px 14px}
.side .brand{display:flex;align-items:center;gap:12px;padding:0 8px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.side .brand img{width:40px;height:40px;border-radius:8px;background:#fff;padding:3px}
.side .brand b{display:block;font-size:17px;line-height:1.2}.side .brand small{font-size:12px;color:rgba(255,255,255,.7)}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.8);font-weight:600;font-size:15px}
.side nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav a.on{background:rgba(245,182,15,.14);color:var(--accent)}
.side .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:18px 12px 6px}
.side .sub a{font-size:13.5px;font-weight:500;padding:7px 12px}
.side .sub a i{font-style:normal;color:var(--accent);font-weight:700;width:16px}
.side .bot-side{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.85);font-weight:600;font-size:14px}.side .bot-side:hover{background:rgba(255,255,255,.07);color:#fff}.side .bot-side img{width:26px;height:26px;border-radius:6px;background:#fff;padding:2px;object-fit:contain}.side .bot-side span{color:var(--accent)}
.side .out{font-size:13px;color:rgba(255,255,255,.7);padding:10px 12px}
.side .out:hover{color:#fff}
main{padding:34px 40px 40px}
.hello{padding:34px 36px}
.hello p{font-size:17px;max-width:640px}
.resume{max-width:460px}
.chs{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ch{grid-template-columns:minmax(0,1fr);padding:0;overflow:hidden;align-items:stretch;gap:0}
.ch .im{width:100%;height:140px;border-radius:0}
.ch .im i{left:12px;top:12px;width:30px;height:30px;font-size:15px}
.ch .tx{padding:14px 16px 16px}
.ch .ar{display:none}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cover{min-height:300px}.cover .in{padding:34px 36px}
.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg{max-width:520px}
.gridres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
}
@media(max-width:380px){.tabs a{font-size:9.5px}main{padding-left:12px;padding-right:12px}}
</style>
<script src="assets/app-nav.js"></script>
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div>
<header class="top" id="top"></header>
<main id="view"></main>
</div>
</div>
<nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
<script>
const I={
check:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
read:'<path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/>',
sum:'<path d="M4 6h16M4 12h10M4 18h6"/>',
ess:'<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="M9 13h6M9 17h4"/>',
voc:'<rect x="3" y="6" width="14" height="10" rx="2"/><path d="M21 8v8"/>',
vid:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3Z"/>',
pod:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
ppl:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/>',
arr:'<path d="M9 6l6 6-6 6"/>',left:'<path d="M15 18l-6-6 6-6"/>',play:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const ic=(n,s=20,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const T={cr:'Compte rendu',oral:'Oral',voc:'Vocabulaire',vid:'Vidéo',pod:'Podcast',pdf:'Support PDF',test:'Test'};
const CR=[
{k:'cr',t:"'Awkward and humiliating'…",d:"Entraînement guidé en 5 étapes, The Guardian, mai 2026.",h:'ai-interviews-compte-rendu.html'},
{k:'cr',t:"UK's 'anxious generation'…",d:"Entraînement guidé en 6 étapes, The Guardian, mai 2026.",h:'anxious-generation-compte-rendu.html'},
{k:'cr',t:'"Less stress, more energy"…',d:"Entraînement guidé en 5 étapes, The Sunday Times.",h:'compte-rendu-pas-a-pas.html'}];
const OR=[
{k:'oral',t:'Cloud computing',h:'oraux-bts-sio.html'},
{k:'oral',t:'Risks of AI at work',h:'oraux-bts-sio.html'},
{k:'oral',t:'AI and the job market',h:'oraux-bts-sio.html'}];
const VO=[
{k:'voc',t:'Business English',d:'Vocabulaire du recrutement.',h:'business-english-vocabulaire-sio.html'},
{k:'voc',t:'Business English 2',d:'Monde du travail : bien-être, diversité, flexibilité.',h:'business-english-2-vocabulaire-sio.html'},
{k:'voc',t:'Link words',d:'Les mots de liaison pour structurer un discours.',h:'link-words-vocabulaire-sio.html'}];
const GK=[
{g:'Vidéos',k:'vid',t:'GB vs UK',h:'general-knowledge-sio.html#gb-vs-uk'},{g:'Vidéos',k:'vid',t:"Enquête sur l'inventeur du bitcoin",h:'general-knowledge-sio.html#inventeur-bitcoin'},
{g:'Podcasts',k:'pod',t:'Fifty States',h:'general-knowledge-sio.html#fifty-states'}];
/* Rubrique Tests : à alimenter. Format : {k:'test',t:'Titre',d:'Description',h:'page.html'} */
const TE=[];
const ALL=[...CR.map(x=>({...x,ct:'Compte rendu'})),...OR.map(x=>({...x,ct:'Épreuves orales'})),...VO.map(x=>({...x,ct:'Vocabulaire'})),...GK.map(x=>({...x,ct:'General Knowledge'})),...TE.map(x=>({...x,ct:'Tests'}))];
const TABS=[['home','Accueil','home'],['cr','Compte rendu','ess'],['oral','Oral','pod'],['vocabulaire','Vocabulaire','voc'],['culture','Culture G','globe'],['tests','Tests','check']];
const route=()=>(location.hash.slice(1)||'home').split('/');
document.addEventListener('click',e=>{const a=e.target.closest('a[data-t]');if(a)try{localStorage.setItem('sio-last',JSON.stringify({t:a.dataset.t,h:a.getAttribute('href')}))}catch(_){}});
const cls={cr:'ess',oral:'sum',voc:'voc',vid:'vid',pod:'vid',test:'ess'},ico={cr:'ess',oral:'pod',voc:'voc',vid:'vid',pod:'pod',test:'check'};
const row=x=>`<a class="r" href="${x.h}" data-t="${x.t.replace(/"/g,'&quot;')}"><span class="ic ${cls[x.k]}">${ic(ico[x.k],19)}</span><span><small>${T[x.k]}</small><b>${x.t}</b>${x.d?`<em class="dsc">${x.d}</em>`:''}</span><span class="ar">${ic('arr',18,2.4)}</span></a>`;
const block=(id,title,n,items)=>`<div class="sec"><h2>${title}</h2><a href="#${id}">${n}</a></div><div class="res gridres">${items.map(row).join('')}</div>`;
const foot=`<footer class="foot"><img class="l" src="assets/lsa-logo.png" alt="Logo LSA"><span>Lycée Sidoine Apollinaire · M. Blanchet</span><div class="visit-count" id="visitCount"></div></footer>`;
const V={
home(){let l=null;try{l=JSON.parse(localStorage.getItem('sio-last'))}catch(_){}
return `<section class="hello"><h1>BTS SIO <span>Toolbox</span></h1><p>Le compte rendu pas à pas, les épreuves orales, le vocabulaire et la culture générale.</p>${l?`<a class="resume" href="${l.h}"><span class="g"><small>Reprendre</small><b>${l.t}</b></span>${ic('play',20,2.4)}</a>`:''}</section>
${block('cr','Le CR pas à pas','3 fiches',CR)}${block('oral','Épreuves orales','3 sujets',OR)}${block('vocabulaire','Vocabulaire','3 fiches',VO)}
<div class="sec"><h2>Aussi</h2></div><div class="tiles">
<a class="tile" href="#culture"><span class="ic">${ic('globe')}</span><b>General Knowledge<small>Vidéos et podcast</small></b></a>
<a class="tile" href="https://1cours1bot.fr" target="_blank" rel="noopener"><span class="ic bot"><img src="assets/1cours1bot-logo.png" alt=""></span><b>1cours1bot<small>Externe ↗</small></b></a></div>`},
cr(){return `<h1>Le CR pas à pas</h1><p class="lead">Entraînements guidés pour rédiger en français le compte rendu d'un article de presse anglais.</p><div class="res" style="margin-top:16px">${CR.map(row).join('')}</div>`},
oral(){return `<h1>Épreuves orales</h1><p class="lead">Sujets d'entraînement à l'oral : un support PDF et une vidéo pour chaque entraînement.</p><div class="res" style="margin-top:16px">${OR.map(row).join('')}</div>`},
vocabulaire(){return `<h1>Vocabulaire</h1><p class="lead">Flashcards, QCM en contexte et phrases à compléter.</p><div class="res" style="margin-top:16px">${VO.map(row).join('')}</div>`},
culture(){const gs=[...new Set(GK.map(x=>x.g))];return `<h1>General Knowledge</h1>${gs.map(g=>`<div class="sec"><h2>${g}</h2></div><div class="res gridres">${GK.filter(x=>x.g===g).map(row).join('')}</div>`).join('')}`},
tests(){return `<h1>Tests</h1><p class="lead">Évaluations et entraînements en ligne.</p>`+(TE.length?`<div class="res" style="margin-top:16px">${TE.map(row).join('')}</div>`:`<p class="empty">Cette rubrique sera bientôt alimentée.</p>`)},
recherche(){return `<h1>Recherche</h1><label class="sbox" style="margin-top:16px">${ic('search')}<input id="q" type="search" placeholder="Compte rendu, oral, vocabulaire…" autocomplete="off"></label><div id="out" class="res" style="margin-top:14px"></div>`}
};
function chrome(cur){
const SH={cr:'CR',vocabulaire:'Vocab.'};document.getElementById('tabs').innerHTML=TABS.map(([k,l,i])=>`<a href="#${k}" class="${cur===k?'on':''}">${ic(i,22)}${SH[k]||l}</a>`).join('')+`<a href="https://1cours1bot.fr" target="_blank" rel="noopener"><img class="tbot" src="assets/1cours1bot-logo.png" alt="">1cours1bot</a>`;
document.getElementById('top').innerHTML=`<img src="assets/lsa-logo.png" alt=""><div class="tt"><b>BTS SIO</b><small>LSA Toolbox · M. Blanchet</small></div><a class="ib" href="#recherche" aria-label="Rechercher">${ic('search',22)}</a>`;
document.getElementById('side').innerHTML=`<div class="brand"><img src="assets/lsa-logo.png" alt=""><div><b>BTS SIO</b><small>LSA Toolbox · M. Blanchet</small></div></div>
<nav>${[...TABS,['recherche','Recherche','search']].map(([k,l,i])=>`<a href="#${k}" class="${cur===k?'on':''}">${ic(i,19)}${l}</a>`).join('')}</nav>
<a class="bot-side" href="https://1cours1bot.fr" target="_blank" rel="noopener"><img src="assets/1cours1bot-logo.png" alt="">1cours1bot <span>↗</span></a>`;
}
function search(){const q=document.getElementById('q'),o=document.getElementById('out');const n=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
q.addEventListener('input',()=>{const v=n(q.value.trim());if(!v){o.innerHTML='';return}const r=ALL.filter(x=>n(x.t+' '+(x.d||'')+' '+x.ct+' '+T[x.k]).includes(v));
o.innerHTML=r.length?r.map(row).join(''):'<p class="empty">Aucune ressource ne correspond à votre recherche.</p>'});q.focus();}
function render(){const [v]=route();chrome(v);
document.getElementById('view').innerHTML=(V[v]||V.home)()+foot;window.scrollTo(0,0);if(v==='recherche')search();
const k=(location.pathname.split('/').pop()||'index').replace('.html','');const e=document.getElementById('visitCount');if(e)e.innerHTML='<img src="https://api.visitorbadge.io/api/visitors?path=lsa-sio-'+encodeURIComponent(k)+'&label=Visites&countColor=%23f5b60f&labelColor=%230f1a33&style=flat-square" alt="compteur de visites">';}
addEventListener('hashchange',render);render();
</script>
</body>
</html>
